name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Lint custom code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: PHP syntax check
        run: |
          find public/theme/insuretech public/local/itskills public/mod/itrecording deploy -name '*.php' -print0 \
            | xargs -0 -n1 php -l > lint.txt 2>&1 || { grep -v '^No syntax errors' lint.txt; exit 1; }
      - name: Shell syntax check
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: Image builds
        if: github.event_name == 'pull_request'
        run: docker build -f deploy/Dockerfile -t insuretech-lms:ci .

  deploy:
    name: Deploy to VPS
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/insuretech-lms
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts; fi
          printf 'Host vps\n  HostName %s\n  Port %s\n  User lmsdeploy\n  IdentityFile ~/.ssh/id_deploy\n' "$HOST" "$PORT" > ~/.ssh/config

      - name: Build and push image to GitHub Container Registry
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f deploy/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Pull image on the server
        run: |
          # Short-lived token for this job only; logged out again right after the pull.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh vps "docker pull -q '$IMAGE:${{ github.sha }}' && docker tag '$IMAGE:${{ github.sha }}' insuretech-lms:latest; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
          rsync -az --delete deploy/ vps:/opt/insuretech-lms/app/deploy/

      - name: Install or upgrade, restart
        run: ssh vps 'LMS_BUILD=0 bash /opt/insuretech-lms/app/deploy/remote-deploy.sh'
